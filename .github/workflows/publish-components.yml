name: Publish Components

# Triggered manually or called from publish-all.yml
on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: components

jobs:

  # ── Static gates ──────────────────────────────────────────────────────────
  # Runs first and fast. Two things are checked here that nothing else can catch:
  #   1. lint:raw-values in STRICT mode — no raw design values in component source.
  #      Strict is the default now; the repository passes it with zero findings and
  #      this job exists to keep it that way.
  #   2. test:contracts — src/storybook/mcp.ts is hand-written metadata that agents
  #      consume as the component API. Nothing in the build forces it to match the
  #      Angular source, so this asserts it does.
  static-gates:
    name: Static Gates (token policy + API contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      # The components package links the token package from disk and the built CSS is
      # not committed, so it has to be produced before anything reads it. Storybook is
      # rendered against the tokens this repository declares — the same thing a developer
      # sees locally — rather than whatever version happens to be on npm.
      - name: Build tokens the components link against
        working-directory: design-tokens
        run: npm ci && npm run build
      - run: npm ci
      - name: Lint raw values (strict)
        run: npm run lint:raw-values:strict
      - name: Verify MCP contracts against component source
        run: npm run test:contracts

  # ── Unit Tests ────────────────────────────────────────────────────────────
  # Jest + jsdom, no browser binary. Covers component logic and DOM contracts;
  # browser-level behaviour belongs to the interaction and a11y jobs below.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  # ── Build Storybook (shared artifact) ────────────────────────────────────
  # Built once and reused by accessibility, interactions, and visual-regression jobs.
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      # The components package links the token package from disk and the built CSS is
      # not committed, so it has to be produced before anything reads it. Storybook is
      # rendered against the tokens this repository declares — the same thing a developer
      # sees locally — rather than whatever version happens to be on npm.
      - name: Build tokens the components link against
        working-directory: design-tokens
        run: npm ci && npm run build
      - run: npm ci
      # Guard against building the whole visual suite on a token package that does not
      # cover the component source: every missing variable renders as a collapsed layout,
      # and a11y and visual regression would both be measuring the wrong thing. This job
      # previously pulled @latest from npm here, which is precisely how Storybook ended up
      # rendering against 294 variables while the source defined 468.
      - name: Verify the tokens cover every variable the components use
        run: npm run test:contracts
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: components/storybook-static/
          retention-days: 1

  # ── Accessibility Tests ───────────────────────────────────────────────────
  # Uses @storybook/test-runner + axe-playwright to run axe against every story.
  # Per-story opt-out: set  parameters: { a11y: { disable: true } }  in the story.
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: components/storybook-static/
      - name: Serve Storybook
        run: npx http-server storybook-static -p 6006 --silent &
      - name: Wait for Storybook to be ready
        run: npx wait-on http://localhost:6006 --timeout 30000
      - name: Run accessibility tests (axe)
        run: npm run test:a11y

  # ── Visual Regression ─────────────────────────────────────────────────────
  # Diffs every story against the baselines in .lostpixel/baseline/.
  #
  # Baselines MUST be generated by the visual-baseline workflow, which runs on the
  # same ubuntu-latest image as this job. Baselines generated on a developer laptop
  # render fonts differently and produce failures that have nothing to do with the
  # change under review.
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Verify baselines exist
        run: |
          COUNT=$(find .lostpixel/baseline -name '*.png' 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No committed visual baselines. This gate is not protecting anything."
            echo "::error::Run the 'Generate Visual Baselines' workflow, then merge the PR it opens."
            exit 1
          fi
          echo "Comparing against ${COUNT} committed baselines."
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: components/storybook-static/
      - name: Install Lost Pixel's Playwright browser
        run: node node_modules/lost-pixel/node_modules/playwright-core/cli.js install chromium
      - name: Run visual regression (Lost Pixel)
        run: npm run test:visual
      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lostpixel-diff
          path: components/.lostpixel/difference/
          retention-days: 7

  # ── UI Functionalities ────────────────────────────────────────────────────
  # Uses @storybook/test-runner to execute play() functions defined in stories.
  ui-functionalities:
    name: UI Functionalities
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: components/storybook-static/
      - name: Serve Storybook
        run: npx http-server storybook-static -p 6006 --silent &
      - name: Wait for Storybook to be ready
        run: npx wait-on http://localhost:6006 --timeout 30000
      - name: Run interaction tests (play functions)
        run: npm run test:interactions

  # ── Release: publish @jablonowski/dsb-components to npm ──────────────────
  release:
    name: Release — publish to npm
    runs-on: ubuntu-latest
    needs:
      - accessibility-tests
      - visual-regression
      - ui-functionalities
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Update tokens to latest published
        run: npm install @jablonowski/dsb-tokens@latest
      # The published package must already contain every variable the components use.
      # Publishing components against a token version that lags source is how a release
      # ships collapsed spacing to consumers while every gate upstream stayed green.
      - name: Refuse to publish against token versions that lag the source
        run: npm run test:contracts
      - name: Build library
        run: npm run build
      - name: Verify client LLM guide in package
        run: test -f dist/llms.client.txt
      - name: Bump version from npm registry
        working-directory: components/dist
        run: |
          PUBLISHED=$(npm view @jablonowski/dsb-components version 2>/dev/null || echo "0.0.0")
          NEXT=$(node -p "const v='${PUBLISHED}'.split('.');v[2]=String(+v[2]+1);v.join('.')")
          npm version ${NEXT} --no-git-tag-version
      - name: Publish to npm
        working-directory: components/dist
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
