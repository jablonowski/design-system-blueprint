name: Publish Components

# Triggered manually or called from publish-all.yml
on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: components

jobs:

  # ── Unit Tests ────────────────────────────────────────────────────────────
  # TODO: implement Angular unit tests (Jest / Karma)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package.json
      - run: npm install
      - name: Run unit tests
        run: echo "TODO — unit tests not yet implemented" && exit 0

  # ── Accessibility Tests ───────────────────────────────────────────────────
  # TODO: implement axe-core / storybook-addon-a11y checks
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package.json
      - run: npm install
      - name: Run accessibility tests
        run: echo "TODO — accessibility tests not yet implemented" && exit 0

  # ── Visual Regression ─────────────────────────────────────────────────────
  # TODO: implement Storybook + Chromatic / Percy / Playwright visual diffing
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package.json
      - run: npm install
      - name: Run visual regression tests
        run: echo "TODO — visual regression not yet implemented" && exit 0

  # ── UI Functionalities ────────────────────────────────────────────────────
  # TODO: implement Storybook interaction tests / Playwright e2e for components
  ui-functionalities:
    name: UI Functionalities
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package.json
      - run: npm install
      - name: Run UI functionality tests
        run: echo "TODO — UI functionality tests not yet implemented" && exit 0

  # ── Release: publish @jablonowski/dsb-components to npm ──────────────────
  release:
    name: Release — publish to npm
    runs-on: ubuntu-latest
    needs:
      - accessibility-tests
      - visual-regression
      - ui-functionalities
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: components/package.json
      - run: npm install
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
