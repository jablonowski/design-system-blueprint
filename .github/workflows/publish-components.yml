name: Publish Components

# Triggered manually or called from publish-all.yml
on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: components

jobs:

  # ── Unit Tests ────────────────────────────────────────────────────────────
  # TODO: implement Angular unit tests (Jest / Karma)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Lint raw values (token policy)
        run: npm run lint:raw-values
        env:
          DS_LINT_ROLLOUT: baseline
      - name: Run unit tests
        run: echo "TODO — unit tests not yet implemented" && exit 0

  # ── Build Storybook (shared artifact) ────────────────────────────────────
  # Built once and reused by accessibility, interactions, and visual-regression jobs.
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Update tokens to latest published
        run: npm install @jablonowski/dsb-tokens@latest
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: components/storybook-static/
          retention-days: 1

  # ── Accessibility Tests ───────────────────────────────────────────────────
  # Uses @storybook/test-runner + axe-playwright to run axe against every story.
  # Per-story opt-out: set  parameters: { a11y: { disable: true } }  in the story.
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: components/storybook-static/
      - name: Serve Storybook
        run: npx http-server storybook-static -p 6006 --silent &
      - name: Wait for Storybook to be ready
        run: npx wait-on http://localhost:6006 --timeout 30000
      - name: Run accessibility tests (axe)
        run: npm run test:a11y

  # ── Visual Regression ─────────────────────────────────────────────────────
  # Uses Lost Pixel to take screenshots of every story and diff against baselines
  # stored in .lostpixel/baseline/ (committed to the repo).
  #
  # FIRST RUN: generate baselines locally with  npm run test:visual:update
  # then commit the .lostpixel/baseline/ directory.
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: components/storybook-static/
      - name: Install Lost Pixel's Playwright browser
        run: node node_modules/lost-pixel/node_modules/playwright-core/cli.js install chromium
      - name: Run visual regression (Lost Pixel)
        run: npm run test:visual
      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lostpixel-diff
          path: components/.lostpixel/difference/
          retention-days: 7

  # ── UI Functionalities ────────────────────────────────────────────────────
  # Uses @storybook/test-runner to execute play() functions defined in stories.
  # Play functions are the interaction tests for organisms: Accordion, Dropdown, Modal, Button.
  ui-functionalities:
    name: UI Functionalities
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: components/storybook-static/
      - name: Serve Storybook
        run: npx http-server storybook-static -p 6006 --silent &
      - name: Wait for Storybook to be ready
        run: npx wait-on http://localhost:6006 --timeout 30000
      - name: Run interaction tests (play functions)
        run: npm run test:interactions

  # ── Release: publish @jablonowski/dsb-components to npm ──────────────────
  release:
    name: Release — publish to npm
    runs-on: ubuntu-latest
    needs:
      - accessibility-tests
      - visual-regression
      - ui-functionalities
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: components/package-lock.json
      - run: npm ci
      - name: Update tokens to latest published
        run: npm install @jablonowski/dsb-tokens@latest
      - name: Build library
        run: npm run build
      - name: Verify client LLM guide in package
        run: test -f dist/llms.client.txt
      - name: Bump version from npm registry
        working-directory: components/dist
        run: |
          PUBLISHED=$(npm view @jablonowski/dsb-components version 2>/dev/null || echo "0.0.0")
          NEXT=$(node -p "const v='${PUBLISHED}'.split('.');v[2]=String(+v[2]+1);v.join('.')")
          npm version ${NEXT} --no-git-tag-version
      - name: Publish to npm
        working-directory: components/dist
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
