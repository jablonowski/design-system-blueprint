name: Publish All

# Full release: tokens first, then components.
# Components release only starts after tokens release succeeds.
on:
  workflow_dispatch:

jobs:

  publish-tokens:
    name: Publish Tokens
    uses: ./.github/workflows/publish-tokens.yml
    secrets: inherit

  publish-components:
    name: Publish Components
    uses: ./.github/workflows/publish-components.yml
    needs: publish-tokens
    secrets: inherit

  generate-llms-context:
    name: Generate llms.txt
    runs-on: ubuntu-latest
    needs: publish-components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate llms.txt
        run: npm run generate:llms
      - name: Upload llms.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: llms-context
          path: llms.txt
          retention-days: 7
