name: Publish All

# Full release: tokens first, then everything that depends on them.
#
# The Token MCP and the components both wait for the token publish, for the same reason:
# each is validated against the token set, and publishing either against a token version
# that lags the source is how a consumer ends up with variables that resolve to nothing.
on:
  workflow_dispatch:

jobs:

  publish-tokens:
    name: Publish Tokens
    uses: ./.github/workflows/publish-tokens.yml
    secrets: inherit

  publish-token-mcp:
    name: Publish Token MCP
    uses: ./.github/workflows/publish-tokens-mcp.yml
    needs: publish-tokens
    secrets: inherit

  publish-components:
    name: Publish Components
    uses: ./.github/workflows/publish-components.yml
    needs: publish-tokens
    secrets: inherit

  generate-llms-context:
    name: Generate llms.txt
    runs-on: ubuntu-latest
    needs: publish-components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate llms.txt
        run: npm run generate:llms
      - name: Upload llms.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: llms-context
          path: llms.txt
          retention-days: 7
