name: Publish Tokens

# Triggered manually or called from publish-all.yml
on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: design-tokens

jobs:

  # ── npm credentials ──────────────────────────────────────────────────────
  # npm answers an unauthorised write with 404, not 401, so a missing or expired token
  # surfaces as "package not found" — after every gate has run and the version has already
  # been bumped. Granular access tokens also expire, silently, at most 90 days after they
  # are made. This runs first and names the actual cause.
  #
  # working-directory is pinned because the workflow default points at a package folder
  # that does not exist in a job with no checkout.
  npm-auth:
    name: npm credentials
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the token can publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is empty. Add it as a secret on the 'npm-publish' environment (Settings -> Environments), or as a repository secret."
            exit 1
          fi
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::npm rejected the token: ${WHO}"
            echo "::error::Most likely expired — granular access tokens last 90 days at most. Create a new one at npmjs.com -> Access Tokens with read and write on @jablonowski, then update the NPM_TOKEN secret."
            exit 1
          fi
          echo "Authenticated as ${WHO}."

  # ── Layer 1: JSON syntax ──────────────────────────────────────────────────
  validate-json:
    name: Validate tokens.json (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design-tokens/package-lock.json
      - run: npm ci
      - run: npm run lint:json

  # ── Layer 2: Token schema and tier boundaries ─────────────────────────────
  # Enforces that tier 2 only references tier 1 and tier 3 only references tier 2.
  # This is the architectural firewall; if it fails, the token graph has a hole in it.
  validate-schema:
    name: Validate tokens.json (schema + tier boundaries)
    runs-on: ubuntu-latest
    needs: validate-json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design-tokens/package-lock.json
      - run: npm ci
      - run: npm run lint:schema

  # ── Layer 3: Token MCP contract ───────────────────────────────────────────
  # The resolver ships the token graph to agents, so its guarantees gate the token
  # release: no tier 1/3 answers, no value-based lookup, no-coverage over guessing.
  contract-tests:
    name: Token MCP contract tests
    runs-on: ubuntu-latest
    needs: validate-schema
    defaults:
      run:
        working-directory: tokens-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  # ── Build: Style Dictionary ───────────────────────────────────────────────
  build:
    name: Build (Style Dictionary)
    runs-on: ubuntu-latest
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design-tokens/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tokens-dist
          path: design-tokens/dist/
          retention-days: 1

  # ── Layer 4: CSS output assertions ───────────────────────────────────────
  test:
    name: Test CSS output
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design-tokens/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: tokens-dist
          path: design-tokens/dist/
      - run: npm test

  # ── Release: publish @jablonowski/dsb-tokens to npm ──────────────────────
  release:
    name: Release — publish to npm
    runs-on: ubuntu-latest
    needs: [test, npm-auth]
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: design-tokens/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify the public token surface contains no raw options
        run: |
          if grep -q -- '-options-' dist/css/public.css; then
            echo "::error::public.css leaks tier 1 tokens — the distribution boundary is broken"
            exit 1
          fi
          echo "public.css exposes decisions only"
      - name: Bump version from npm registry
        run: |
          PUBLISHED=$(npm view @jablonowski/dsb-tokens version 2>/dev/null || echo "0.0.0")
          NEXT=$(node -p "const v='${PUBLISHED}'.split('.');v[2]=String(+v[2]+1);v.join('.')")
          npm version ${NEXT} --no-git-tag-version
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
