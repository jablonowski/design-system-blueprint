  <text x="600" y="618" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#c3ded0">Consuming an update is a</text>
  <text x="600" y="638" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#c3ded0">dependency bump, not a copy-paste.</text>
  <text x="938" y="608" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2f5a3f">distribution.test.js</text>
  <text x="938" y="626" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#2f5a3f">pins the packed</text>
