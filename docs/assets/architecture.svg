<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Architecture: Figma design source generates tokens, tokens build into three enforced tiers, components consume tier 2 and 3, agent contracts describe the components, and all three packages publish to npm. Every layer has a gate that runs on every pull request.">
