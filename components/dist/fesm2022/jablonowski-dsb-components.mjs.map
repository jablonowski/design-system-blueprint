<span
  class="avatar"
  [ngClass]="['avatar-' + size, 'avatar-' + shape, src ? 'avatar-img' : 'avatar-initials']"
  [attr.aria-label]="alt || name || null"
  role="img"
>
  <img *ngIf="src" [src]="src" [alt]="alt || name" class="avatar-image" />
  <span *ngIf="!src" class="avatar-text">{{ initials }}</span>
</span>
